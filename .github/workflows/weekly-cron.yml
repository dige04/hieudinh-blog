name: Weekly Generation

on:
  schedule:
    # Friday 20:00 ICT (13:00 UTC)
    - cron: '0 13 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (health + auth path only)'
        required: false
        default: false
        type: boolean

env:
  SITE_URL: ${{ secrets.SITE_URL }}

jobs:
  generate-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check required secrets
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::SITE_URL secret is not configured"
            exit 1
          fi
          if [ -z "${{ secrets.WEEKLY_API_SECRET }}" ]; then
            echo "::error::WEEKLY_API_SECRET secret is not configured"
            exit 1
          fi
          echo "Configuration OK"

      - name: Health check
        run: |
          response=$(curl -sS -w "\n%{http_code}" "$SITE_URL/api/weekly/generate")
          http_code=$(printf "%s" "$response" | tail -n1)
          body=$(printf "%s" "$response" | sed '$d')

          echo "Health status: $http_code"
          echo "$body"

          if [ "$http_code" != "200" ]; then
            echo "::error::Health check failed"
            exit 1
          fi

      - name: Trigger weekly generation
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" \
            -X POST "$SITE_URL/api/weekly/generate" \
            -H "x-api-secret: ${{ secrets.WEEKLY_API_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"dryRun":false}')

          http_code=$(printf "%s" "$response" | tail -n1)
          body=$(printf "%s" "$response" | sed '$d')

          echo "POST status: $http_code"
          echo "$body"

          if [ "$http_code" != "200" ]; then
            echo "::error::Weekly generation failed"
            exit 1
          fi

      - name: Dry run trigger
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" \
            -X POST "$SITE_URL/api/weekly/generate" \
            -H "x-api-secret: ${{ secrets.WEEKLY_API_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"dryRun":true}')

          http_code=$(printf "%s" "$response" | tail -n1)
          body=$(printf "%s" "$response" | sed '$d')

          echo "Dry-run status: $http_code"
          echo "$body"

          if [ "$http_code" != "200" ]; then
            echo "::error::Weekly dry run failed"
            exit 1
          fi

  notify-failure:
    runs-on: ubuntu-latest
    needs: generate-weekly
    if: failure()
    steps:
      - name: Log failure details
        run: |
          echo "::error::Weekly generation pipeline failed!"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Rollback: See apps/web/plans/20260213-1335-weekly-rss-vn-insights-automation/rollback-playbook.md"
