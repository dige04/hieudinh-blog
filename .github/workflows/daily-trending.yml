name: Daily Trending Collection

on:
  schedule:
    # 3x/day: 08:00, 16:00, 00:00 UTC
    # (15:00, 23:00, 07:00 ICT)
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (health check only)'
        required: false
        default: false
        type: boolean

env:
  SITE_URL: ${{ secrets.SITE_URL }}

jobs:
  collect-daily-trending:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check required secrets
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::SITE_URL secret is not configured"
            exit 1
          fi
          if [ -z "${{ secrets.TRENDING_API_SECRET }}" ]; then
            echo "::error::TRENDING_API_SECRET secret is not configured"
            exit 1
          fi
          echo "Configuration OK"

      - name: Health check
        run: |
          response=$(curl -sS -w "\n%{http_code}" "$SITE_URL/api/trending/daily")
          http_code=$(printf "%s" "$response" | tail -n1)
          body=$(printf "%s" "$response" | sed '$d')

          echo "Health status: $http_code"
          echo "$body"

          if [ "$http_code" != "200" ]; then
            echo "::error::Health check failed"
            exit 1
          fi

      - name: Trigger daily collection
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" \
            -X POST "$SITE_URL/api/trending/daily" \
            -H "x-api-secret: ${{ secrets.TRENDING_API_SECRET }}" \
            -H "Content-Type: application/json")

          http_code=$(printf "%s" "$response" | tail -n1)
          body=$(printf "%s" "$response" | sed '$d')

          echo "POST status: $http_code"
          echo "$body"

          if [ "$http_code" != "200" ]; then
            echo "::error::Daily collection failed"
            exit 1
          fi

  notify-failure:
    runs-on: ubuntu-latest
    needs: collect-daily-trending
    if: failure()
    steps:
      - name: Log failure details
        run: |
          echo "::error::Daily trending collection failed!"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Re-run: gh workflow run daily-trending.yml"
