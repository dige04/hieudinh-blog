# CLIProxyAPI Configuration (Render Deployment)
# ================================================
# This is a template. Values wrapped in __PLACEHOLDER__ are replaced
# by entrypoint.sh at container startup using environment variables.

# Bind all interfaces (required for Render)
host: ""

# Port is set dynamically by Render via $PORT
port: __PORT__

# TLS is handled by Render's edge proxy
tls:
  enable: false
  cert: ""
  key: ""

# Management API - disabled for security on public deployment
remote-management:
  allow-remote: false
  secret-key: ""
  disable-control-panel: true

# Auth directory for OAuth token files
auth-dir: "__AUTH_DIR__"

# API keys for client authentication (injected from CLIPROXY_API_KEYS env var)
api-keys:
__API_KEYS__

# Logging
debug: __DEBUG__
logging-to-file: false
logs-max-total-size-mb: 0

# Performance - keep memory low for free tier (512MB)
commercial-mode: true

# Retry configuration
request-retry: __REQUEST_RETRY__
max-retry-interval: __MAX_RETRY_INTERVAL__

# Quota handling
quota-exceeded:
  switch-project: true
  switch-preview-model: true

# Routing strategy
routing:
  strategy: "__ROUTING_STRATEGY__"

# Emit keepalive for non-streaming to prevent Render idle timeout
nonstream-keepalive-interval: __NONSTREAM_KEEPALIVE__

# Streaming keepalive to prevent Render's 100s idle connection timeout
streaming:
  keepalive-seconds: 15
  bootstrap-retries: 1

# Usage statistics disabled to save memory
usage-statistics-enabled: false
