# Render.com Blueprint (render.yaml)
# ================================================
# Deploy: Connect this repo on Render dashboard, or use `render blueprint apply`
#
# IMPORTANT: After deploying, you must set these environment variables
# in the Render dashboard (Settings > Environment):
#
#   AUTH_FILES_B64    - Base64-encoded tar.gz of auth files (use sync-auth.sh to generate)
#   CLIPROXY_API_KEYS - Comma-separated API keys for client authentication
#
# These are NOT in this file because they contain secrets.

services:
  - type: web
    name: cliproxyapi
    runtime: docker
    plan: free
    region: oregon

    # Build from this subdirectory
    dockerfilePath: infra/render-cliproxyapi/Dockerfile
    dockerContext: infra/render-cliproxyapi

    # Render health check
    healthCheckPath: /v1/models

    # Environment variables (non-secret defaults)
    envVars:
      # Render injects PORT automatically; CLIProxyAPI will bind to it
      - key: CLIPROXY_REQUEST_RETRY
        value: "3"
      - key: CLIPROXY_MAX_RETRY_INTERVAL
        value: "30"
      - key: CLIPROXY_ROUTING_STRATEGY
        value: "round-robin"
      - key: CLIPROXY_NONSTREAM_KEEPALIVE
        value: "30"
      - key: CLIPROXY_DEBUG
        value: "false"

      # SECRETS - set these manually in Render dashboard
      # - key: AUTH_FILES_B64
      #   value: <base64-encoded tar.gz of ~/.cli-proxy-api/>
      # - key: CLIPROXY_API_KEYS
      #   value: <comma-separated API keys>
